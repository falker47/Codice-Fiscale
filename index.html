<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <!-- Meta viewport per adattarsi ai dispositivi mobili -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolo Codice Fiscale</title>

  <!-- Favicons -->
  <link href="favicon.png" rel="icon">
  <link href="favicon.png" rel="apple-touch-icon">

  <!-- Anteprima Immagine (Open Graph e Twitter) -->
  <meta property="og:title" content="Calcolo Codice Fiscale">
  <meta property="og:description"
    content="Web app che calcola il codice fiscale italiano a partire dai dati anagrafici e viceversa, ovvero recuperare dal codice fiscale sesso, data e luogo di nascita.">
  <meta property="og:image" content="https://falker47.github.io/Codice-Fiscale/link-preview.webp">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Calcolo Codice Fiscale">
  <meta name="twitter:description"
    content="Web app che calcola il codice fiscale italiano a partire dai dati anagrafici e viceversa, ovvero recuperare dal codice fiscale sesso, data e luogo di nascita.">
  <meta name="twitter:image" content="https://falker47.github.io/Codice-Fiscale/link-preview.webp">

  <!-- Import del font "Poppins" da Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Foglio di stile personalizzato -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="background-decor" aria-hidden="true"></div>
  <main class="wrapper">
    <header class="app-header">
      <h1>Calcolo Codice Fiscale</h1>
    </header>

    <div class="container">
      <!-- Sezione per generare il Codice Fiscale -->
      <section id="generator" class="tool-panel">
        <div class="section-heading">
          <span class="section-index">01</span>
          <h2>Calcola</h2>
        </div>
        <form id="cfForm">
          <!-- Prima riga: Nome e Cognome (no-wrap per evitare wrapping su mobile) -->
          <div class="form-row no-wrap">
            <div class="form-group">
              <label for="name">Nome</label>
              <input type="text" id="name" autocomplete="given-name" placeholder="Mario" required>
            </div>
            <div class="form-group">
              <label for="surname">Cognome</label>
              <input type="text" id="surname" autocomplete="family-name" placeholder="Rossi" required>
            </div>
          </div>

          <!-- Seconda riga: Data di nascita, Sesso, Comune di nascita -->
          <div class="form-row">
            <div class="form-group" id="birthGroup">
              <label for="birthdate">Data di nascita</label>
              <input type="date" id="birthdate" required>
            </div>
            <div class="form-group" id="genderGroup">
              <span class="field-label">Sesso</span>
              <div class="segmented-control" role="radiogroup" aria-label="Sesso">
                <label class="segment">
                  <input type="radio" id="genderM" name="gender" value="M" checked>
                  <span>M</span>
                </label>
                <label class="segment">
                  <input type="radio" id="genderF" name="gender" value="F">
                  <span>F</span>
                </label>
              </div>
            </div>
            <div class="form-group" id="placeGroup">
              <label for="place">Comune di nascita</label>
              <input type="text" id="place" list="comuniList" placeholder="Roma" required>
              <datalist id="comuniList"></datalist>
            </div>
          </div>

          <button type="submit" class="primary-button">
            <span>Genera Codice Fiscale</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </form>

        <!-- Box dedicato all'output -->
        <div class="output-box" id="cfResultBox" aria-live="polite">
          <span class="result-label">Risultato</span>
          <div class="result-row">
            <span id="cfResultText"></span>
            <!-- Bottone per copiare il CF (inizialmente nascosto via script) -->
            <button id="copyCFButton" class="copy-button" style="display: none;" title="Copia il codice fiscale"
              aria-label="Copia il codice fiscale">
              <!-- Icona "copia" (inline SVG) -->
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Sezione per decodificare il Codice Fiscale -->
      <section id="decoder" class="tool-panel">
        <div class="section-heading">
          <span class="section-index">02</span>
          <h2>Decodifica</h2>
        </div>
        <form id="decodeForm">
          <label for="cfInput">Codice Fiscale</label>
          <div class="input-group">
            <input type="text" id="cfInput" placeholder="RSSMRA80A01H501U" minlength="16" maxlength="16" required>
            <button type="submit" id="decodeBtn" class="primary-button compact-button">
              <span>Decodifica</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </form>

        <!-- Box dedicato all'output -->
        <div class="output-box decode-output" aria-live="polite">
          <span class="result-label">Dati estratti</span>
          <div id="decodeResultBox"></div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>
      <a href="https://falker47.github.io/Nexus-portfolio/" target="_blank">
        &copy; <span id="currentYear"></span> Maurizio Falconi - falker47
      </a>
    </p>
  </footer>


  <div id="toast-container"></div>
  <script src="script.js"></script>
</body>

</html>
